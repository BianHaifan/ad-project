---
- name: Bootstrap target server B
  hosts: b
  become: true
  vars:
    compose_dir: /opt/adproject/infra/docker
    google_oauth_client_id: "{{ vault_google_oauth_client_id | default('') }}"
    google_oauth_client_secret: "{{ vault_google_oauth_client_secret | default('') }}"
    google_oauth_redirect_uri: "{{ vault_google_oauth_redirect_uri | default('') }}"
    google_oauth_web_return_uri: "{{ vault_google_oauth_web_return_uri | default('') }}"
    google_oauth_token_encryption_key: "{{ vault_google_oauth_token_encryption_key | default('') }}"
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker and Compose plugin
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Enable and start docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Create compose directory
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: directory
        mode: "0755"

    - name: Copy Dockerfile.backend
      ansible.builtin.copy:
        src: ../docker/Dockerfile.backend
        dest: "{{ compose_dir }}/Dockerfile.backend"

    - name: Copy Dockerfile.web
      ansible.builtin.copy:
        src: ../docker/Dockerfile.web
        dest: "{{ compose_dir }}/Dockerfile.web"

    - name: Copy Dockerfile.ml
      ansible.builtin.copy:
        src: ../docker/Dockerfile.ml
        dest: "{{ compose_dir }}/Dockerfile.ml"

    - name: Copy nginx.conf
      ansible.builtin.copy:
        src: ../docker/nginx.conf
        dest: "{{ compose_dir }}/nginx.conf"

    - name: Copy TLS certificate
      ansible.builtin.copy:
        src: ../docker/certs/ad-b-server.crt
        dest: "{{ compose_dir }}/certs/ad-b-server.crt"
        mode: "0644"

    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: ../docker/docker-compose.yml
        dest: "{{ compose_dir }}/docker-compose.yml"

    - name: Check whether .env already exists
      ansible.builtin.stat:
        path: "{{ compose_dir }}/.env"
      register: env_stat

    - name: Generate secrets when .env is missing
      ansible.builtin.set_fact:
        db_root_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
        db_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
        jwt_secret: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=64') }}"
        ml_internal_token: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=64') }}"
      no_log: true
      when: not env_stat.stat.exists

    - name: Write .env (only when missing, keeps existing secrets)
      ansible.builtin.template:
        src: templates/docker.env.j2
        dest: "{{ compose_dir }}/.env"
        mode: "0600"
      no_log: true
      when: not env_stat.stat.exists

    - name: Generate ML token when adding it to an existing .env
      ansible.builtin.set_fact:
        ml_internal_token: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=64') }}"
      no_log: true
      when: env_stat.stat.exists

    - name: Ensure ML_INTERNAL_TOKEN exists in existing .env
      ansible.builtin.lineinfile:
        path: "{{ compose_dir }}/.env"
        regexp: "^ML_INTERNAL_TOKEN="
        line: "ML_INTERNAL_TOKEN={{ ml_internal_token }}"
      no_log: true
      when: env_stat.stat.exists

    - name: Read existing .env content without printing it
      ansible.builtin.command: cat "{{ compose_dir }}/.env"
      register: existing_env
      changed_when: false
      no_log: true
      when: env_stat.stat.exists

    - name: Ensure GOOGLE_OAUTH_CLIENT_ID exists in existing .env
      ansible.builtin.lineinfile:
        path: "{{ compose_dir }}/.env"
        regexp: "^GOOGLE_OAUTH_CLIENT_ID="
        line: "GOOGLE_OAUTH_CLIENT_ID={{ google_oauth_client_id }}"
      no_log: true
      when:
        - env_stat.stat.exists
        - google_oauth_client_id | length > 0
        - "'GOOGLE_OAUTH_CLIENT_ID=' not in existing_env.stdout"

    - name: Ensure GOOGLE_OAUTH_CLIENT_SECRET exists in existing .env
      ansible.builtin.lineinfile:
        path: "{{ compose_dir }}/.env"
        regexp: "^GOOGLE_OAUTH_CLIENT_SECRET="
        line: "GOOGLE_OAUTH_CLIENT_SECRET={{ google_oauth_client_secret }}"
      no_log: true
      when:
        - env_stat.stat.exists
        - google_oauth_client_secret | length > 0
        - "'GOOGLE_OAUTH_CLIENT_SECRET=' not in existing_env.stdout"

    - name: Ensure GOOGLE_OAUTH_REDIRECT_URI exists in existing .env
      ansible.builtin.lineinfile:
        path: "{{ compose_dir }}/.env"
        regexp: "^GOOGLE_OAUTH_REDIRECT_URI="
        line: "GOOGLE_OAUTH_REDIRECT_URI={{ google_oauth_redirect_uri }}"
      no_log: true
      when:
        - env_stat.stat.exists
        - google_oauth_redirect_uri | length > 0
        - "'GOOGLE_OAUTH_REDIRECT_URI=' not in existing_env.stdout"

    - name: Ensure GOOGLE_OAUTH_WEB_RETURN_URI exists in existing .env
      ansible.builtin.lineinfile:
        path: "{{ compose_dir }}/.env"
        regexp: "^GOOGLE_OAUTH_WEB_RETURN_URI="
        line: "GOOGLE_OAUTH_WEB_RETURN_URI={{ google_oauth_web_return_uri }}"
      no_log: true
      when:
        - env_stat.stat.exists
        - google_oauth_web_return_uri | length > 0
        - "'GOOGLE_OAUTH_WEB_RETURN_URI=' not in existing_env.stdout"

    - name: Ensure GOOGLE_TOKEN_ENCRYPTION_KEY exists in existing .env
      ansible.builtin.lineinfile:
        path: "{{ compose_dir }}/.env"
        regexp: "^GOOGLE_TOKEN_ENCRYPTION_KEY="
        line: "GOOGLE_TOKEN_ENCRYPTION_KEY={{ google_oauth_token_encryption_key }}"
      no_log: true
      when:
        - env_stat.stat.exists
        - google_oauth_token_encryption_key | length > 0
        - "'GOOGLE_TOKEN_ENCRYPTION_KEY=' not in existing_env.stdout"

    - name: Ensure .env is owned by ubuntu so the deploy user can read it
      ansible.builtin.file:
        path: "{{ compose_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Create 2G swap to protect the small instance
      ansible.builtin.shell: |
        if [ ! -f /swapfile ]; then
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
        fi
      args:
        executable: /bin/bash
      changed_when: false
