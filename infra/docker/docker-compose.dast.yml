services:
  mysql:
    image: mysql:8.4

  backend:
    image: adproject-backend:dast
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/adproject?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: adproject
      DB_PASSWORD: ${DB_PASSWORD:-adproject}
      JWT_SECRET: ${JWT_SECRET:-}
      ML_ENABLED: ${ML_ENABLED:-true}
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:-}
    ports:
      - "8080:8080"

  ml:
    image: adproject-ml:dast
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ml
    environment:
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/internal/v1/health', timeout=3).status == 200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: adproject-web:dast
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "80:80"

  agent:
    image: adproject-agent:dast
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.agent
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}