<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4B5563"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 21px; fill: #4B5563; }
      .section { font-size: 18px; font-weight: 700; fill: #1F4E79; }
      .boxTitle { font-size: 24px; font-weight: 700; fill: #111827; }
      .boxTitleWhite { font-size: 24px; font-weight: 700; fill: #FFFFFF; }
      .boxText { font-size: 17px; fill: #374151; }
      .small { font-size: 15px; fill: #4B5563; }
      .module { font-size: 15px; font-weight: 600; fill: #1F2937; }
      .arrowText { font-size: 14px; fill: #4B5563; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Title -->
  <g class="font">
    <text x="80" y="78" class="title">Intelligent Recruitment Platform</text>
    <text x="80" y="116" class="subtitle">System Architecture and Technology Stack</text>
    <line x1="80" y1="140" x2="1840" y2="140" stroke="#1F4E79" stroke-width="3"/>
  </g>

  <!-- Client layer -->
  <g class="font">
    <text x="80" y="190" class="section">Client Applications</text>

    <rect x="180" y="220" width="500" height="140" rx="8" fill="#EAF2F8" stroke="#1F4E79" stroke-width="2"/>
    <text x="430" y="265" class="boxTitle" text-anchor="middle">Candidate Android App</text>
    <text x="430" y="300" class="boxText" text-anchor="middle">Kotlin · Jetpack Compose · Retrofit</text>
    <text x="430" y="332" class="small" text-anchor="middle">Job search, resume, applications and Agent chat</text>

    <rect x="1240" y="220" width="500" height="140" rx="8" fill="#EAF2F8" stroke="#1F4E79" stroke-width="2"/>
    <text x="1490" y="265" class="boxTitle" text-anchor="middle">Recruiter and Admin Web</text>
    <text x="1490" y="300" class="boxText" text-anchor="middle">React 19 · TypeScript · Vite</text>
    <text x="1490" y="332" class="small" text-anchor="middle">Jobs, applicants, review and audit</text>

    <path d="M430 360 V430" fill="none" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1490 360 V430" fill="none" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="960" y="396" class="arrowText" text-anchor="middle">HTTPS · REST/JSON · JWT</text>
  </g>

  <!-- Spring backend -->
  <g class="font">
    <rect x="180" y="440" width="1560" height="280" rx="8" fill="#F8FAFC" stroke="#1F4E79" stroke-width="3"/>
    <rect x="180" y="440" width="1560" height="56" rx="8" fill="#1F4E79"/>
    <rect x="180" y="480" width="1560" height="16" fill="#1F4E79"/>
    <text x="960" y="477" class="boxTitleWhite" text-anchor="middle">Spring Boot Modular Monolith — Java 21 / Spring Boot 3.5</text>

    <text x="230" y="535" class="section">Business modules</text>
    <rect x="230" y="555" width="160" height="48" rx="5" fill="#FFFFFF" stroke="#94A3B8"/><text x="310" y="585" class="module" text-anchor="middle">Auth &amp; User</text>
    <rect x="405" y="555" width="160" height="48" rx="5" fill="#FFFFFF" stroke="#94A3B8"/><text x="485" y="585" class="module" text-anchor="middle">Company</text>
    <rect x="580" y="555" width="160" height="48" rx="5" fill="#FFFFFF" stroke="#94A3B8"/><text x="660" y="585" class="module" text-anchor="middle">Resume</text>
    <rect x="755" y="555" width="160" height="48" rx="5" fill="#FFFFFF" stroke="#94A3B8"/><text x="835" y="585" class="module" text-anchor="middle">Job</text>
    <rect x="230" y="617" width="160" height="48" rx="5" fill="#FFFFFF" stroke="#94A3B8"/><text x="310" y="647" class="module" text-anchor="middle">Application</text>
    <rect x="405" y="617" width="160" height="48" rx="5" fill="#FFFFFF" stroke="#94A3B8"/><text x="485" y="647" class="module" text-anchor="middle">Recommendation</text>
    <rect x="580" y="617" width="160" height="48" rx="5" fill="#FFF7ED" stroke="#C67C00"/><text x="660" y="647" class="module" text-anchor="middle">Agent</text>
    <rect x="755" y="617" width="160" height="48" rx="5" fill="#FFFFFF" stroke="#94A3B8"/><text x="835" y="647" class="module" text-anchor="middle">Admin</text>

    <line x1="960" y1="525" x2="960" y2="681" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1010" y="535" class="section">Agent execution controls</text>
    <text x="1010" y="570" class="boxText">1. Validate structured plan and tool whitelist</text>
    <text x="1010" y="603" class="boxText">2. Generate field-level preview</text>
    <text x="1010" y="636" class="boxText">3. Require explicit user confirmation</text>
    <text x="1010" y="669" class="boxText">4. Check idempotency, expiry and resource version</text>
    <text x="230" y="699" class="small">OpenAPI 3.1 · Spring Security · JPA · Flyway · MySQL transactions · Agent Run/Step audit</text>
  </g>

  <!-- Internal service arrows -->
  <g class="font">
    <path d="M430 720 V780" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="446" y="755" class="arrowText">JPA</text>
    <path d="M850 720 V780" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="866" y="755" class="arrowText">Internal HTTP</text>
    <path d="M1270 720 V780" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="1286" y="755" class="arrowText">Internal HTTP</text>
  </g>

  <!-- Data and services -->
  <g class="font">
    <text x="80" y="815" class="section">Data and Internal Services</text>

    <rect x="180" y="840" width="500" height="130" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
    <text x="430" y="882" class="boxTitle" text-anchor="middle">MySQL 8.4</text>
    <text x="430" y="916" class="boxText" text-anchor="middle">Business data and Agent persistence</text>
    <text x="430" y="946" class="small" text-anchor="middle">Users · jobs · resumes · runs · steps · conversations</text>

    <rect x="710" y="840" width="400" height="130" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
    <text x="910" y="882" class="boxTitle" text-anchor="middle">ML Recommendation Service</text>
    <text x="910" y="916" class="boxText" text-anchor="middle">Python 3.12 · FastAPI · scikit-learn</text>
    <text x="910" y="946" class="small" text-anchor="middle">Explainable Top-N job ranking</text>

    <rect x="1140" y="840" width="430" height="130" rx="8" fill="#FFF7ED" stroke="#C67C00" stroke-width="2"/>
    <text x="1355" y="878" class="boxTitle" text-anchor="middle">Python Agent Planner</text>
    <text x="1355" y="909" class="boxText" text-anchor="middle">FastAPI · LangGraph · Pydantic</text>
    <text x="1355" y="938" class="small" text-anchor="middle">Creates validated plans; no JWT, DB access or writes</text>

    <path d="M1570 905 H1632" stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="1600" y="890" class="arrowText" text-anchor="middle">HTTPS</text>
    <rect x="1640" y="840" width="200" height="130" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="1740" y="882" class="boxTitle" text-anchor="middle">DeepSeek</text>
    <text x="1740" y="916" class="boxText" text-anchor="middle">deepseek-v4-flash</text>
    <text x="1740" y="946" class="small" text-anchor="middle">Strict JSON plan</text>
  </g>

  <!-- Infrastructure footer -->
  <g class="font">
    <line x1="80" y1="1010" x2="1840" y2="1010" stroke="#CBD5E1" stroke-width="2"/>
    <text x="80" y="1050" class="section">Infrastructure</text>
    <text x="270" y="1050" class="boxText">AWS EC2  ·  Docker Compose  ·  Nginx + TLS  ·  GitHub Actions CI/CD  ·  Terraform  ·  Ansible</text>
  </g>
</svg>
