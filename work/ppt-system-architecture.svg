<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0B1E35"/>
      <stop offset="1" stop-color="#102845"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1769E0"/>
      <stop offset="1" stop-color="#5846D7"/>
    </linearGradient>
    <linearGradient id="android" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163F49"/>
      <stop offset="1" stop-color="#12313C"/>
    </linearGradient>
    <linearGradient id="web" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153655"/>
      <stop offset="1" stop-color="#152B47"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000814" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#58B8FF"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 50px; font-weight: 760; fill: #F7FBFF; letter-spacing: -1px; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #98B2CF; letter-spacing: 0.5px; }
      .section { font-size: 15px; font-weight: 750; fill: #6EBFFF; letter-spacing: 2.2px; }
      .cardTitle { font-size: 26px; font-weight: 730; fill: #FFFFFF; }
      .cardSub { font-size: 17px; font-weight: 560; fill: #BBD1E7; }
      .badge { font-size: 15px; font-weight: 650; fill: #EAF5FF; }
      .small { font-size: 14px; font-weight: 520; fill: #ABC1D8; }
      .module { font-size: 14px; font-weight: 650; fill: #EAF3FF; }
      .infra { font-size: 15px; font-weight: 650; fill: #D8E8F8; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1700" cy="110" r="340" fill="#1677FF" opacity="0.07"/>
  <circle cx="280" cy="900" r="390" fill="#20C7A6" opacity="0.045"/>
  <path d="M0 770 C420 700, 770 900, 1180 815 S1710 730, 1920 820" fill="none" stroke="#4AA5F4" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Header -->
  <g class="sans">
    <rect x="72" y="58" width="12" height="80" rx="6" fill="#35D3B4"/>
    <text x="112" y="96" class="title">Intelligent Recruitment Platform</text>
    <text x="114" y="132" class="subtitle">SYSTEM ARCHITECTURE &amp; TECHNOLOGY STACK  ·  API-FIRST MODULAR MONOLITH</text>
    <g transform="translate(1496 69)">
      <rect width="350" height="64" rx="18" fill="#0E2742" stroke="#264866"/>
      <circle cx="34" cy="32" r="10" fill="#35D3B4"/>
      <text x="58" y="27" class="small" fill="#DAE9F6">MVP principle</text>
      <text x="58" y="48" class="badge">Core flow survives AI/ML failure</text>
    </g>
  </g>

  <!-- Client layer -->
  <text x="72" y="204" class="sans section">01  CLIENT APPLICATIONS</text>
  <g class="sans" filter="url(#shadow)">
    <rect x="72" y="230" width="440" height="180" rx="26" fill="url(#android)" stroke="#2B6870"/>
    <circle cx="122" cy="282" r="26" fill="#35D3B4" opacity="0.17"/>
    <path d="M110 288h24v-19h-24z M114 266l-4-6 M130 266l4-6" fill="none" stroke="#57E6CB" stroke-width="3" stroke-linecap="round"/>
    <text x="166" y="280" class="cardTitle">Candidate Android App</text>
    <text x="166" y="307" class="cardSub">Job search · Apply · Resume · AI Agent</text>
    <rect x="104" y="338" width="92" height="38" rx="19" fill="#1D665E"/><text x="126" y="363" class="badge">Kotlin</text>
    <rect x="208" y="338" width="158" height="38" rx="19" fill="#1B5961"/><text x="230" y="363" class="badge">Jetpack Compose</text>
    <rect x="378" y="338" width="102" height="38" rx="19" fill="#1A4B58"/><text x="400" y="363" class="badge">Retrofit</text>

    <rect x="560" y="230" width="440" height="180" rx="26" fill="url(#web)" stroke="#31577D"/>
    <circle cx="610" cy="282" r="26" fill="#4AAAF7" opacity="0.17"/>
    <rect x="597" y="269" width="26" height="20" rx="3" fill="none" stroke="#67C2FF" stroke-width="3"/>
    <path d="M604 293h12 M610 289v4" stroke="#67C2FF" stroke-width="3" stroke-linecap="round"/>
    <text x="654" y="280" class="cardTitle">Recruiter &amp; Admin Web</text>
    <text x="654" y="307" class="cardSub">Jobs · Applications · Review · Analytics</text>
    <rect x="592" y="338" width="92" height="38" rx="19" fill="#204D72"/><text x="616" y="363" class="badge">React 19</text>
    <rect x="696" y="338" width="118" height="38" rx="19" fill="#204765"/><text x="718" y="363" class="badge">TypeScript</text>
    <rect x="826" y="338" width="142" height="38" rx="19" fill="#1C3D59"/><text x="850" y="363" class="badge">Vite · Query</text>
  </g>

  <!-- Shared contract -->
  <g class="sans">
    <path d="M1020 320 H1123" stroke="#58B8FF" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1042" y="296" class="small">HTTPS</text>
    <text x="1033" y="345" class="small">JSON / JWT</text>
    <rect x="1132" y="246" width="714" height="164" rx="26" fill="#0E223A" stroke="#2B4D6B"/>
    <text x="1170" y="281" class="section">SHARED API CONTRACT</text>
    <text x="1170" y="320" class="cardTitle">OpenAPI  ·  REST  ·  Role-Based Access</text>
    <text x="1170" y="350" class="cardSub">Spring Boot is the only public business API</text>
    <g transform="translate(1562 277)">
      <path d="M37 3l28 11v20c0 22-13 38-28 47C22 72 9 56 9 34V14z" fill="#2B77D8" opacity="0.35" stroke="#66BCFF" stroke-width="2"/>
      <path d="M26 39l8 8 16-19" fill="none" stroke="#8FE7D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Core backend -->
  <text x="72" y="472" class="sans section">02  CORE BUSINESS BACKEND</text>
  <g filter="url(#shadow)" class="sans">
    <rect x="72" y="498" width="1774" height="282" rx="30" fill="#0B1B31" stroke="#28517A"/>
    <rect x="96" y="522" width="474" height="234" rx="24" fill="url(#core)"/>
    <circle cx="145" cy="570" r="25" fill="#FFFFFF" opacity="0.14"/>
    <path d="M133 570h24 M145 558v24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="185" y="570" class="cardTitle">Spring Boot API</text>
    <text x="185" y="599" class="cardSub" fill="#DCEBFF">Java 21 · Spring Boot 3.5</text>
    <text x="126" y="642" class="badge">Security + JWT</text>
    <text x="126" y="675" class="badge">JPA + Validation</text>
    <text x="126" y="708" class="badge">Transactions + Audit</text>
    <rect x="370" y="625" width="158" height="96" rx="18" fill="#0B1A3A" opacity="0.32"/>
    <text x="394" y="657" class="small" fill="#D9E8FF">Architecture</text>
    <text x="394" y="687" class="badge">Modular</text>
    <text x="394" y="711" class="badge">Monolith</text>

    <text x="616" y="554" class="section">DOMAIN MODULES</text>
    <g>
      <rect x="616" y="578" width="182" height="58" rx="14" fill="#122C49" stroke="#2D5578"/><text x="672" y="613" class="module">Auth &amp; User</text>
      <rect x="814" y="578" width="182" height="58" rx="14" fill="#122C49" stroke="#2D5578"/><text x="866" y="613" class="module">Company</text>
      <rect x="1012" y="578" width="182" height="58" rx="14" fill="#122C49" stroke="#2D5578"/><text x="1068" y="613" class="module">Resume</text>
      <rect x="1210" y="578" width="182" height="58" rx="14" fill="#122C49" stroke="#2D5578"/><text x="1274" y="613" class="module">Job</text>
      <rect x="616" y="650" width="182" height="58" rx="14" fill="#122C49" stroke="#2D5578"/><text x="658" y="685" class="module">Application</text>
      <rect x="814" y="650" width="182" height="58" rx="14" fill="#122C49" stroke="#2D5578"/><text x="836" y="685" class="module">Recommendation</text>
      <rect x="1012" y="650" width="182" height="58" rx="14" fill="#122C49" stroke="#2D5578"/><text x="1071" y="685" class="module">AI Agent</text>
      <rect x="1210" y="650" width="182" height="58" rx="14" fill="#122C49" stroke="#2D5578"/><text x="1265" y="685" class="module">Admin</text>
    </g>
    <path d="M1418 570v144" stroke="#294B68"/>
    <text x="1460" y="554" class="section">GUARDRAILS</text>
    <circle cx="1470" cy="596" r="4" fill="#35D3B4"/><text x="1486" y="602" class="small">Authentication &amp; ownership checks</text>
    <circle cx="1470" cy="634" r="4" fill="#35D3B4"/><text x="1486" y="640" class="small">DTO isolation · UTC persistence</text>
    <circle cx="1470" cy="672" r="4" fill="#35D3B4"/><text x="1486" y="678" class="small">Agent preview → user confirmation</text>
    <circle cx="1470" cy="710" r="4" fill="#35D3B4"/><text x="1486" y="716" class="small">ML fallback keeps CRUD available</text>
  </g>

  <!-- Data and intelligence -->
  <text x="72" y="840" class="sans section">03  DATA &amp; INTELLIGENCE SERVICES</text>
  <g class="sans" filter="url(#shadow)">
    <rect x="72" y="862" width="408" height="116" rx="22" fill="#102942" stroke="#2D5979"/>
    <ellipse cx="124" cy="898" rx="25" ry="10" fill="#3D8DD0"/><path d="M99 898v35c0 6 11 11 25 11s25-5 25-11v-35" fill="#286CA9"/><ellipse cx="124" cy="933" rx="25" ry="10" fill="#347FBF"/>
    <text x="174" y="902" class="cardTitle">MySQL 8.4</text>
    <text x="174" y="931" class="cardSub">Business source of truth</text>
    <text x="174" y="958" class="small">Flyway migrations · transactional consistency</text>

    <rect x="504" y="862" width="514" height="116" rx="22" fill="#142A3F" stroke="#396079"/>
    <circle cx="558" cy="918" r="28" fill="#F7BF4B" opacity="0.18"/>
    <path d="M543 922c12-24 28-24 31-7 3 17-12 26-29 12" fill="none" stroke="#FFD36B" stroke-width="4" stroke-linecap="round"/>
    <text x="602" y="902" class="cardTitle">Recommendation Service</text>
    <text x="602" y="931" class="cardSub">Python 3.12 · FastAPI · scikit-learn</text>
    <text x="602" y="958" class="small">Explainable Top-N ranking via internal HTTP</text>

    <rect x="1042" y="862" width="402" height="116" rx="22" fill="#182742" stroke="#4C557B"/>
    <circle cx="1096" cy="918" r="28" fill="#8B7CFF" opacity="0.19"/>
    <path d="M1083 919l9 9 18-22 M1084 906h23v25h-23z" fill="none" stroke="#A99EFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1140" y="902" class="cardTitle">AI Agent Adapter</text>
    <text x="1140" y="931" class="cardSub">Controlled business tools</text>
    <text x="1140" y="958" class="small">Least privilege · explicit confirmation · audit</text>

    <rect x="1468" y="862" width="378" height="116" rx="22" fill="#10283A" stroke="#2A5B62"/>
    <circle cx="1520" cy="918" r="27" fill="#35D3B4" opacity="0.16"/>
    <path d="M1507 920h26 M1511 912l9-9 9 9 M1511 928l9 9 9-9" fill="none" stroke="#66E7D0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1564" y="902" class="cardTitle">Approved LLM</text>
    <text x="1564" y="931" class="cardSub">Natural-language planning</text>
    <text x="1564" y="958" class="small">No direct database access</text>
  </g>

  <!-- Infrastructure footer -->
  <g class="sans">
    <rect x="0" y="1010" width="1920" height="70" fill="#07111F"/>
    <text x="72" y="1053" class="section">INFRASTRUCTURE</text>
    <circle cx="330" cy="1044" r="5" fill="#58B8FF"/><text x="346" y="1050" class="infra">AWS EC2</text>
    <circle cx="470" cy="1044" r="5" fill="#58B8FF"/><text x="486" y="1050" class="infra">Docker Compose</text>
    <circle cx="656" cy="1044" r="5" fill="#58B8FF"/><text x="672" y="1050" class="infra">Nginx + TLS</text>
    <circle cx="812" cy="1044" r="5" fill="#58B8FF"/><text x="828" y="1050" class="infra">GitHub Actions CI/CD</text>
    <circle cx="1074" cy="1044" r="5" fill="#58B8FF"/><text x="1090" y="1050" class="infra">Terraform</text>
    <circle cx="1206" cy="1044" r="5" fill="#58B8FF"/><text x="1222" y="1050" class="infra">Ansible</text>
    <circle cx="1320" cy="1044" r="5" fill="#58B8FF"/><text x="1336" y="1050" class="infra">OpenAPI</text>
    <text x="1702" y="1050" class="small" text-anchor="end">AD Project · 2026</text>
  </g>
</svg>
