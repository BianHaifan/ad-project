<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF4FF"/>
      <stop offset="1" stop-color="#F7FBFF"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1769E0"/>
      <stop offset="1" stop-color="#5B4BDE"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2EEFF"/>
      <stop offset="1" stop-color="#F8F6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183B64" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2785E6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7457D9"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 48px; font-weight: 760; fill: #102A43; letter-spacing: -1px; }
      .subtitle { font-size: 19px; font-weight: 520; fill: #58718A; letter-spacing: 0.35px; }
      .section { font-size: 15px; font-weight: 760; fill: #247DD2; letter-spacing: 2px; }
      .cardTitle { font-size: 25px; font-weight: 740; fill: #17324D; }
      .cardSub { font-size: 16px; font-weight: 570; fill: #526D86; }
      .badge { font-size: 14px; font-weight: 680; fill: #28506F; }
      .small { font-size: 13.5px; font-weight: 520; fill: #60788F; }
      .module { font-size: 13px; font-weight: 680; fill: #264A68; }
      .whiteTitle { font-size: 26px; font-weight: 750; fill: #FFFFFF; }
      .whiteSub { font-size: 16px; font-weight: 570; fill: #E3EDFF; }
      .whiteText { font-size: 14px; font-weight: 650; fill: #FFFFFF; }
      .infra { font-size: 14px; font-weight: 650; fill: #36566F; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1920" height="170" fill="url(#headerGlow)"/>
  <circle cx="1775" cy="45" r="240" fill="#D7EBFF" opacity="0.38"/>
  <circle cx="1650" cy="1020" r="300" fill="#F2EEFF" opacity="0.55"/>

  <!-- Header -->
  <g class="sans">
    <rect x="72" y="48" width="11" height="78" rx="5.5" fill="#2CC8A4"/>
    <text x="112" y="86" class="title">Intelligent Recruitment Platform</text>
    <text x="114" y="122" class="subtitle">SYSTEM ARCHITECTURE &amp; TECHNOLOGY STACK  ·  UPDATED AGENT PLANNING PIPELINE</text>
    <g transform="translate(1492 58)">
      <rect width="354" height="70" rx="18" fill="#FFFFFF" stroke="#CFE0EF" filter="url(#shadow)"/>
      <circle cx="34" cy="35" r="10" fill="#2CC8A4"/>
      <text x="58" y="29" class="small">Architecture principle</text>
      <text x="58" y="51" class="badge">Spring Boot owns authorization &amp; writes</text>
    </g>
  </g>

  <!-- Clients -->
  <text x="72" y="205" class="sans section">01  CLIENTS &amp; API CONTRACT</text>
  <g class="sans" filter="url(#shadow)">
    <rect x="72" y="228" width="430" height="150" rx="24" fill="#F1FBF8" stroke="#BCE9DF"/>
    <circle cx="122" cy="277" r="25" fill="#D8F4ED"/>
    <path d="M110 283h24v-19h-24z M114 261l-4-6 M130 261l4-6" fill="none" stroke="#18A989" stroke-width="3" stroke-linecap="round"/>
    <text x="164" y="273" class="cardTitle">Candidate Android App</text>
    <text x="164" y="300" class="cardSub">Jobs · Resume · Applications · Agent chat</text>
    <rect x="104" y="322" width="86" height="34" rx="17" fill="#DDF6F0"/><text x="125" y="344" class="badge">Kotlin</text>
    <rect x="200" y="322" width="154" height="34" rx="17" fill="#DDF6F0"/><text x="222" y="344" class="badge">Jetpack Compose</text>
    <rect x="364" y="322" width="106" height="34" rx="17" fill="#DDF6F0"/><text x="387" y="344" class="badge">Retrofit</text>

    <rect x="526" y="228" width="430" height="150" rx="24" fill="#F2F7FD" stroke="#C9DCEF"/>
    <circle cx="576" cy="277" r="25" fill="#DDEEFF"/>
    <rect x="563" y="265" width="26" height="20" rx="3" fill="none" stroke="#2785E6" stroke-width="3"/>
    <path d="M570 289h12 M576 285v4" stroke="#2785E6" stroke-width="3" stroke-linecap="round"/>
    <text x="618" y="273" class="cardTitle">Recruiter &amp; Admin Web</text>
    <text x="618" y="300" class="cardSub">Jobs · Applicants · Review · Audit</text>
    <rect x="558" y="322" width="90" height="34" rx="17" fill="#E2EFFB"/><text x="580" y="344" class="badge">React 19</text>
    <rect x="658" y="322" width="116" height="34" rx="17" fill="#E2EFFB"/><text x="680" y="344" class="badge">TypeScript</text>
    <rect x="784" y="322" width="140" height="34" rx="17" fill="#E2EFFB"/><text x="807" y="344" class="badge">Vite · Query</text>

    <rect x="980" y="228" width="866" height="150" rx="24" fill="#FFFFFF" stroke="#C9D9E7"/>
    <text x="1016" y="261" class="section">PUBLIC API BOUNDARY</text>
    <text x="1016" y="299" class="cardTitle">OpenAPI 3.1 · REST/JSON · JWT · RBAC</text>
    <text x="1016" y="329" class="cardSub">Android and Web only communicate with the Spring Boot API over HTTPS</text>
    <rect x="1595" y="255" width="212" height="83" rx="18" fill="#EDF6FF"/>
    <path d="M1630 272l21 8v16c0 17-10 29-21 36-11-7-21-19-21-36v-16z" fill="#D5E9FD" stroke="#2785E6" stroke-width="2"/>
    <path d="M1620 299l7 7 14-17" fill="none" stroke="#1CAD8E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1663" y="289" class="badge">Single public</text>
    <text x="1663" y="313" class="badge">business API</text>
  </g>

  <!-- Core backend -->
  <text x="72" y="436" class="sans section">02  SPRING BOOT MODULAR MONOLITH</text>
  <g class="sans" filter="url(#shadow)">
    <rect x="72" y="458" width="1774" height="302" rx="28" fill="#F8FBFE" stroke="#C6D9E9"/>
    <rect x="96" y="482" width="440" height="254" rx="23" fill="url(#core)"/>
    <circle cx="144" cy="531" r="24" fill="#FFFFFF" opacity="0.16"/>
    <path d="M132 531h24 M144 519v24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="184" y="530" class="whiteTitle">Spring Boot API</text>
    <text x="184" y="558" class="whiteSub">Java 21 · Spring Boot 3.5</text>
    <text x="126" y="606" class="whiteText">Security + JWT + ownership</text>
    <text x="126" y="638" class="whiteText">JPA + Flyway + transactions</text>
    <text x="126" y="670" class="whiteText">Agent orchestration + tool execution</text>
    <text x="126" y="702" class="whiteText">Run / Step persistence + audit</text>

    <text x="580" y="504" class="section">BUSINESS MODULES</text>
    <g>
      <rect x="580" y="526" width="164" height="51" rx="13" fill="#FFFFFF" stroke="#C8DAE9"/><text x="628" y="558" class="module">Auth &amp; User</text>
      <rect x="756" y="526" width="164" height="51" rx="13" fill="#FFFFFF" stroke="#C8DAE9"/><text x="808" y="558" class="module">Company</text>
      <rect x="932" y="526" width="164" height="51" rx="13" fill="#FFFFFF" stroke="#C8DAE9"/><text x="980" y="558" class="module">Resume</text>
      <rect x="1108" y="526" width="164" height="51" rx="13" fill="#FFFFFF" stroke="#C8DAE9"/><text x="1168" y="558" class="module">Job</text>
      <rect x="580" y="588" width="164" height="51" rx="13" fill="#FFFFFF" stroke="#C8DAE9"/><text x="620" y="620" class="module">Application</text>
      <rect x="756" y="588" width="164" height="51" rx="13" fill="#FFFFFF" stroke="#C8DAE9"/><text x="777" y="620" class="module">Recommendation</text>
      <rect x="932" y="588" width="164" height="51" rx="13" fill="#EEE9FF" stroke="#A796E7"/><text x="969" y="620" class="module" fill="#5B43B6">Agent</text>
      <rect x="1108" y="588" width="164" height="51" rx="13" fill="#FFFFFF" stroke="#C8DAE9"/><text x="1161" y="620" class="module">Admin</text>
    </g>

    <text x="580" y="678" class="section" fill="#684BC5">AGENT SAFETY FLOW</text>
    <g>
      <rect x="580" y="694" width="126" height="38" rx="19" fill="#EDE8FF"/><text x="605" y="718" class="module">Plan</text>
      <path d="M710 713h32" stroke="#7457D9" stroke-width="2" marker-end="url(#arrowPurple)"/>
      <rect x="750" y="694" width="150" height="38" rx="19" fill="#EDE8FF"/><text x="775" y="718" class="module">Validate tools</text>
      <path d="M904 713h32" stroke="#7457D9" stroke-width="2" marker-end="url(#arrowPurple)"/>
      <rect x="944" y="694" width="142" height="38" rx="19" fill="#EDE8FF"/><text x="970" y="718" class="module">Preview diff</text>
      <path d="M1090 713h32" stroke="#7457D9" stroke-width="2" marker-end="url(#arrowPurple)"/>
      <rect x="1130" y="694" width="142" height="38" rx="19" fill="#EDE8FF"/><text x="1152" y="718" class="module">User confirm</text>
    </g>

    <path d="M1306 504v204" stroke="#D4E0EA"/>
    <text x="1344" y="504" class="section">ENFORCEMENT</text>
    <circle cx="1354" cy="541" r="4" fill="#2CC8A4"/><text x="1370" y="547" class="small">Whitelisted read/write tools only</text>
    <circle cx="1354" cy="578" r="4" fill="#2CC8A4"/><text x="1370" y="584" class="small">One-time confirmation + expiry</text>
    <circle cx="1354" cy="615" r="4" fill="#2CC8A4"/><text x="1370" y="621" class="small">Idempotency + resource version checks</text>
    <circle cx="1354" cy="652" r="4" fill="#2CC8A4"/><text x="1370" y="658" class="small">Resume: age · summary · skills · experience</text>
    <circle cx="1354" cy="689" r="4" fill="#2CC8A4"/><text x="1370" y="695" class="small">Safe failure if Planner / LLM unavailable</text>
  </g>

  <!-- Internal services -->
  <text x="72" y="818" class="sans section">03  DATA, ML &amp; AGENT SERVICES</text>
  <g class="sans" filter="url(#shadow)">
    <rect x="72" y="840" width="322" height="150" rx="22" fill="#F4F9FD" stroke="#BED5E7"/>
    <ellipse cx="120" cy="884" rx="23" ry="9" fill="#4C9ADB"/><path d="M97 884v32c0 6 10 10 23 10s23-4 23-10v-32" fill="#3180BE"/><ellipse cx="120" cy="916" rx="23" ry="9" fill="#4492D0"/>
    <text x="164" y="883" class="cardTitle">MySQL 8.4</text>
    <text x="104" y="949" class="cardSub">Business source of truth</text>
    <text x="104" y="973" class="small">Agent runs, steps &amp; conversations</text>

    <rect x="418" y="840" width="400" height="150" rx="22" fill="#FFF9EC" stroke="#E9D7A8"/>
    <circle cx="468" cy="884" r="25" fill="#FCECC1"/>
    <path d="M454 889c11-22 25-22 28-6 3 16-11 24-26 11" fill="none" stroke="#DAA52D" stroke-width="4" stroke-linecap="round"/>
    <text x="508" y="883" class="cardTitle">ML Recommendation</text>
    <text x="450" y="924" class="cardSub">Python 3.12 · FastAPI</text>
    <text x="450" y="949" class="small">scikit-learn · explainable Top-N ranking</text>
    <text x="450" y="973" class="small">Internal HTTP · independent failure boundary</text>

    <rect x="842" y="840" width="566" height="150" rx="22" fill="url(#agent)" stroke="#C2B4ED"/>
    <circle cx="892" cy="884" r="25" fill="#E1D9FA"/>
    <path d="M879 887h26 M883 878l9-9 9 9 M883 896l9 9 9-9" fill="none" stroke="#7457D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="932" y="883" class="cardTitle">Python Agent Planner</text>
    <text x="874" y="924" class="cardSub">Python 3.11 · FastAPI · LangGraph · Pydantic</text>
    <text x="874" y="949" class="small">Instruction + last 20 messages → validated structured plan</text>
    <text x="874" y="973" class="small">No JWT · no database access · no business writes</text>

    <path d="M1412 915h48" stroke="#7457D9" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
    <text x="1419" y="897" class="small" fill="#684BC5">HTTPS</text>

    <rect x="1470" y="840" width="376" height="150" rx="22" fill="#F4F1FF" stroke="#C7BAEE"/>
    <circle cx="1520" cy="884" r="25" fill="#E5DFFD"/>
    <path d="M1507 884l8 8 18-21 M1508 873h24v25h-24z" fill="none" stroke="#7457D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1560" y="883" class="cardTitle">DeepSeek LLM</text>
    <text x="1502" y="924" class="cardSub">deepseek-v4-flash</text>
    <text x="1502" y="949" class="small">OpenAI-compatible Chat Completions</text>
    <text x="1502" y="973" class="small">Strict JSON plan · environment-only API key</text>
  </g>

  <!-- Infrastructure -->
  <g class="sans">
    <rect x="0" y="1020" width="1920" height="60" fill="#F1F6FA"/>
    <text x="72" y="1056" class="section">INFRASTRUCTURE</text>
    <circle cx="326" cy="1049" r="5" fill="#2785E6"/><text x="342" y="1055" class="infra">AWS EC2</text>
    <circle cx="468" cy="1049" r="5" fill="#2785E6"/><text x="484" y="1055" class="infra">Docker Compose</text>
    <circle cx="662" cy="1049" r="5" fill="#2785E6"/><text x="678" y="1055" class="infra">Nginx + TLS</text>
    <circle cx="824" cy="1049" r="5" fill="#2785E6"/><text x="840" y="1055" class="infra">GitHub Actions CI/CD</text>
    <circle cx="1090" cy="1049" r="5" fill="#2785E6"/><text x="1106" y="1055" class="infra">Terraform</text>
    <circle cx="1224" cy="1049" r="5" fill="#2785E6"/><text x="1240" y="1055" class="infra">Ansible</text>
    <circle cx="1338" cy="1049" r="5" fill="#2785E6"/><text x="1354" y="1055" class="infra">Flyway</text>
    <text x="1810" y="1055" class="small" text-anchor="end">AD Project · 2026</text>
  </g>
</svg>
