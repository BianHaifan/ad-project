[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-project-recommender"
version = "0.1.0"
description = "Explainable candidate-job matching model and inference service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "joblib==1.5.3",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "pydantic==2.13.4",
  "scikit-learn==1.9.0",
  "scipy==1.16.3",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.2",
]

[project.scripts]
ad-recommender = "ad_recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
