components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing, invalid, or expired credentials
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    RegisterRequest:
      oneOf:
      - "$ref": "#/components/schemas/CandidateRegisterRequest"
      - "$ref": "#/components/schemas/RecruiterRegisterRequest"
      discriminator:
        propertyName: role
        mapping:
          CANDIDATE: "#/components/schemas/CandidateRegisterRequest"
          RECRUITER: "#/components/schemas/RecruiterRegisterRequest"
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    AuthUser:
      type: object
      required:
      - id
      - role
      - fullName
      - email
      properties:
        id:
          type: string
        role:
          "$ref": "#/components/schemas/UserRole"
        fullName:
          type: string
        email:
          type: string
          format: email
        company:
          oneOf:
          - "$ref": "#/components/schemas/Company"
          - type: 'null'
          description: Present for Recruiter users; absent or null for Candidate users.
    TokenData:
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
    AuthResponse:
      type: object
      required:
      - data
      properties:
        data:
          allOf:
          - "$ref": "#/components/schemas/TokenData"
          - type: object
            required:
            - user
            properties:
              user:
                "$ref": "#/components/schemas/AuthUser"
    TokenResponse:
      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/TokenData"
    EmploymentType:
      type: string
      enum:
      - FULL_TIME
      - INTERNSHIP
      - PART_TIME
    WorkplaceType:
      type: string
      enum:
      - ONSITE
      - HYBRID
      - REMOTE
    Company:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
        logoUrl:
          type:
          - string
          - 'null'
          format: uri
        stage:
          type:
          - string
          - 'null'
          enum:
          - PRE_SEED
          - SEED
          - SERIES_A
          - SERIES_B
          - SERIES_C
          - LATE_STAGE
          - PUBLIC
          - BOOTSTRAPPED
          - 
        employeeRange:
          type:
          - string
          - 'null'
        verificationStatus:
          type:
          - string
          - 'null'
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - 
        website:
          type:
          - string
          - 'null'
          format: uri
        description:
          type:
          - string
          - 'null'
        location:
          type:
          - string
          - 'null'
    Salary:
      type: object
      required:
      - min
      - max
      - currency
      - period
      properties:
        min:
          type: integer
          minimum: 0
        max:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        period:
          type: string
          enum:
          - HOUR
          - MONTH
          - YEAR
    Recruiter:
      type: object
      required:
      - id
      - name
      - role
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        avatarUrl:
          type:
          - string
          - 'null'
          format: uri
    JobSummary:
      allOf:
      - "$ref": "#/components/schemas/Job"
      - type: object
        required:
        - company
        - salary
        - skills
        - matchScore
        - recruiter
        - publishedAt
        properties:
          matchScore:
            type: integer
            minimum: 0
            maximum: 100
          recruiter:
            "$ref": "#/components/schemas/Recruiter"
          publishedAt:
            type: string
            format: date-time
      description: Candidate projection of the unified Job model.
    JobDetail:
      allOf:
      - "$ref": "#/components/schemas/JobSummary"
      - type: object
        required:
        - matchAnalysis
        - description
        - requirements
        - applicationState
        - isSaved
        properties:
          matchAnalysis:
            type: object
            required:
            - strongMatches
            - gaps
            properties:
              strongMatches:
                type: array
                items:
                  type: string
              gaps:
                type: array
                items:
                  type: string
          description:
            type: string
          requirements:
            type: array
            items:
              type: string
          applicationState:
            "$ref": "#/components/schemas/CandidateJobApplicationState"
          isSaved:
            type: boolean
      description: Candidate detail projection of Job; matchAnalysis and applicationState
        are audience-specific.
    ApplicationStatus:
      type: string
      enum:
      - APPLIED
      - IN_REVIEW
      - INTERVIEW
      - REJECTED
      - WITHDRAWN
    SubmitApplicationRequest:
      type: object
      additionalProperties: false
      required:
      - resumeId
      - contactEmail
      - shareProfile
      properties:
        resumeId:
          type: string
        contactEmail:
          type: string
          format: email
        shareProfile:
          type: boolean
    ApplicationCompany:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
        logoUrl:
          type:
          - string
          - 'null'
          format: uri
    TimelineStep:
      type: object
      required:
      - status
      - completed
      properties:
        status:
          "$ref": "#/components/schemas/ApplicationStatus"
        completed:
          type: boolean
        occurredAt:
          type:
          - string
          - 'null'
          format: date-time
    ApplicationSummary:
      allOf:
      - "$ref": "#/components/schemas/Application"
      - type: object
        required:
        - jobTitle
        - company
        - matchScore
        - timeline
        properties:
          id:
            type: string
          jobId:
            type: string
          jobTitle:
            type: string
          company:
            "$ref": "#/components/schemas/ApplicationCompany"
          status:
            "$ref": "#/components/schemas/ApplicationStatus"
          matchScore:
            type: integer
            minimum: 0
            maximum: 100
          appliedAt:
            type: string
            format: date-time
          interviewAt:
            type:
            - string
            - 'null'
            format: date-time
          timeline:
            type: array
            items:
              "$ref": "#/components/schemas/TimelineStep"
    NextStep:
      type: object
      required:
      - type
      - title
      - description
      properties:
        type:
          type: string
          enum:
          - RECRUITER_REVIEW
          - STATUS_UPDATE
          - INTERVIEW_INVITATION
        title:
          type: string
        description:
          type: string
    ApplicationDetail:
      allOf:
      - "$ref": "#/components/schemas/ApplicationSummary"
      - type: object
        required:
        - submittedAt
        - resumeSnapshot
        - nextSteps
        properties:
          submittedAt:
            type: string
            format: date-time
          resumeSnapshot:
            type: object
            required:
            - id
            - name
            properties:
              id:
                type: string
              name:
                type: string
          nextSteps:
            type: array
            items:
              "$ref": "#/components/schemas/NextStep"
          updatedAt:
            type:
            - string
            - 'null'
            format: date-time
    ApplicationListResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - counts
          - items
          properties:
            counts:
              type: object
              required:
              - active
              - interview
              - archived
              properties:
                active:
                  type: integer
                  minimum: 0
                interview:
                  type: integer
                  minimum: 0
                archived:
                  type: integer
                  minimum: 0
            items:
              type: array
              items:
                "$ref": "#/components/schemas/ApplicationSummary"
        meta:
          "$ref": "#/components/schemas/PageMeta"
    Participant:
      type: object
      required:
      - id
      - name
      - role
      - online
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type:
          - string
          - 'null'
          format: uri
        role:
          type: string
        companyName:
          type:
          - string
          - 'null'
          description: Recruiter company for Candidate viewers; nullable for Candidate
            participants seen by Recruiters.
        online:
          type: boolean
    SenderType:
      type: string
      enum:
      - CANDIDATE
      - RECRUITER
      - SYSTEM
    Message:
      type: object
      required:
      - id
      - body
      - senderType
      - sentAt
      - deliveryStatus
      properties:
        id:
          type: string
        body:
          type: string
        senderType:
          "$ref": "#/components/schemas/SenderType"
        sentAt:
          type: string
          format: date-time
        clientMessageId:
          type:
          - string
          - 'null'
          format: uuid
        deliveryStatus:
          type: string
          enum:
          - SENDING
          - SENT
          - DELIVERED
          - READ
          - FAILED
      description: Shared schema; senderType identifies Candidate, Recruiter, or System.
    ConversationSummary:
      type: object
      required:
      - id
      - participant
      - lastMessage
      - unreadCount
      properties:
        id:
          type: string
        participant:
          "$ref": "#/components/schemas/Participant"
        lastMessage:
          "$ref": "#/components/schemas/Message"
        unreadCount:
          type: integer
          minimum: 0
        applicationId:
          type:
          - string
          - 'null'
        jobId:
          type:
          - string
          - 'null'
        jobTitle:
          type:
          - string
          - 'null'
      description: Shared schema; participant is the opposite party from the current
        viewer.
    ConversationDetail:
      type: object
      required:
      - id
      - participant
      properties:
        id:
          type: string
        participant:
          "$ref": "#/components/schemas/Participant"
        context:
          oneOf:
          - "$ref": "#/components/schemas/InterviewContext"
          - type: 'null'
    InterviewContext:
      type: object
      required:
      - type
      - jobId
      - jobTitle
      - scheduledAt
      - mode
      properties:
        type:
          type: string
          const: INTERVIEW_INVITATION
        interviewId:
          type:
          - string
          - 'null'
        applicationId:
          type:
          - string
          - 'null'
        jobId:
          type: string
        jobTitle:
          type: string
        scheduledAt:
          type: string
          format: date-time
        mode:
          "$ref": "#/components/schemas/InterviewMode"
        timezone:
          type:
          - string
          - 'null'
        durationMinutes:
          type:
          - integer
          - 'null'
          minimum: 1
        locationOrMeetingUrl:
          type:
          - string
          - 'null'
        status:
          oneOf:
          - "$ref": "#/components/schemas/InterviewStatus"
          - type: 'null'
      description: Conversation projection of Interview. Candidate source interviewAt/interviewMode
        are normalized to scheduledAt/mode.
    SendMessageRequest:
      type: object
      additionalProperties: false
      required:
      - body
      - clientMessageId
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
        clientMessageId:
          type: string
          format: uuid
    MessageListResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Message"
        meta:
          type: object
          required:
          - nextCursor
          - hasMore
          properties:
            nextCursor:
              type:
              - string
              - 'null'
            hasMore:
              type: boolean
    CandidateStats:
      type: object
      required:
      - chatCount
      - applicationCount
      - interviewCount
      - savedJobCount
      properties:
        chatCount:
          type: integer
          minimum: 0
        applicationCount:
          type: integer
          minimum: 0
        interviewCount:
          type: integer
          minimum: 0
        savedJobCount:
          type: integer
          minimum: 0
    CandidateProfile:
      type: object
      required:
      - id
      - fullName
      - email
      - headline
      - location
      - stats
      - updatedAt
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        headline:
          type: string
        avatarUrl:
          type:
          - string
          - 'null'
          format: uri
        location:
          type: string
        stats:
          "$ref": "#/components/schemas/CandidateStats"
        updatedAt:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        headline:
          type: string
