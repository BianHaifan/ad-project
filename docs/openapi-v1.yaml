openapi: 3.1.0
info:
  title: AD Project Unified Candidate + Recruiter API
  version: 1.0.0-draft
  description: 'DRAFT unified catalog. Method + normalized path is the unique operation
    key. Candidate source: API_V1.md/openapi-v1.yaml. Recruiter source: RECRUITER_API_DRAFT.md
    and RECRUITER_WEB_ANALYSIS.md; the requested RECRUITER_WEB_ANALYSIS.yaml was not
    present.'
servers:
- url: https://api.example.com/api/v1
  description: Placeholder; replace with the environment URL.
tags:
- name: Auth
- name: Profile
- name: Jobs
- name: Applications
- name: Interviews
- name: Conversations
- name: Messages
- name: Resume
- name: Features
security:
- bearerAuth: []
paths:
  "/auth/register":
    post:
      tags:
      - Auth
      summary: Register Candidate or Recruiter
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
      x-status: DRAFT
      x-clients:
      - Candidate
      - Recruiter
      x-permission: Public
  "/auth/login":
    post:
      tags:
      - Auth
      summary: Log in with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      x-status: DRAFT
      x-clients:
      - Candidate
      - Recruiter
      x-permission: Public
  "/auth/refresh":
    post:
      tags:
      - Auth
      summary: Rotate access and refresh tokens
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshTokenRequest"
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TokenResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      x-status: DRAFT
      x-clients:
      - Candidate
      - Recruiter
      x-permission: Public
  "/auth/logout":
    post:
      tags:
      - Auth
      summary: Revoke the current refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshTokenRequest"
      responses:
        '204':
          description: Logged out
        '401':
          "$ref": "#/components/responses/Unauthorized"
      x-status: DRAFT
      x-clients:
      - Candidate
      - Recruiter
      x-permission: Authenticated session
  "/jobs":
    get:
      tags:
      - Jobs
      summary: Search and filter jobs
      operationId: listJobs
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: employmentType
        in: query
        schema:
          "$ref": "#/components/schemas/EmploymentType"
      - name: category
        in: query
        schema:
          type: string
          enum:
          - RECOMMENDED
          - AI_LLM
          - BACKEND
          - DATA
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/PageSize"
      responses:
        '200':
          description: Job page
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/PageResponse"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        "$ref": "#/components/schemas/JobSummary"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
  "/jobs/{jobId}":
    get:
      tags:
      - Jobs
      summary: Get a job and candidate match analysis
      operationId: getJob
      parameters:
      - "$ref": "#/components/parameters/JobId"
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/JobDetail"
        '404':
          "$ref": "#/components/responses/NotFound"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
  "/jobs/{jobId}/applications":
    post:
      tags:
      - Applications
      summary: Submit an application
      operationId: submitApplication
      parameters:
      - "$ref": "#/components/parameters/JobId"
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SubmitApplicationRequest"
      responses:
        '201':
          description: Application submitted
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/ApplicationDetail"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
  "/candidate/applications":
    get:
      tags:
      - Applications
      summary: List the current candidate's applications
      operationId: listApplications
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - INTERVIEW
          - ARCHIVED
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/PageSize"
      responses:
        '200':
          description: Application page with counters
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApplicationListResponse"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
  "/candidate/applications/{applicationId}":
    get:
      tags:
      - Applications
      summary: Get an application
      operationId: getApplication
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Application detail
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/ApplicationDetail"
        '404':
          "$ref": "#/components/responses/NotFound"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
  "/candidate/conversations":
    get:
      tags:
      - Conversations
      summary: List conversations
      operationId: listConversations
      parameters:
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/PageSize"
      responses:
        '200':
          description: Conversation page
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/PageResponse"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        "$ref": "#/components/schemas/ConversationSummary"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
  "/candidate/conversations/{conversationId}":
    get:
      tags:
      - Conversations
      summary: Get conversation participant and business context
      operationId: getConversation
      parameters:
      - "$ref": "#/components/parameters/ConversationId"
      responses:
        '200':
          description: Conversation context
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/ConversationDetail"
        '404':
          "$ref": "#/components/responses/NotFound"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
  "/candidate/conversations/{conversationId}/messages":
    get:
      tags:
      - Messages
      summary: Get message history
      operationId: listMessages
      parameters:
      - "$ref": "#/components/parameters/ConversationId"
      - name: before
        in: query
        description: Return messages older than this message ID.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      responses:
        '200':
          description: Cursor-paginated messages ordered by sentAt ascending
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageListResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
    post:
      tags:
      - Messages
      summary: Send a message
      operationId: sendMessage
      parameters:
      - "$ref": "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SendMessageRequest"
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/Message"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
  "/candidate/conversations/{conversationId}/read-state":
    put:
      tags:
      - Conversations
      summary: Set the last read message
      operationId: updateConversationReadState
      parameters:
      - "$ref": "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ReadStateRequest"
      responses:
        '204':
          description: Read state updated
        '404':
          "$ref": "#/components/responses/NotFound"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
  "/candidate/profile":
    get:
      tags:
      - Profile
      summary: Get candidate profile and counters
      operationId: getCandidateProfile
      responses:
        '200':
          description: Candidate profile
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/CandidateProfile"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
    patch:
      tags:
      - Profile
      summary: Update candidate profile fields
      operationId: updateCandidateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateProfileRequest"
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/CandidateProfile"
        '422':
          "$ref": "#/components/responses/ValidationError"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
  "/candidate/resume":
    get:
      tags:
      - Resume
      summary: Get the candidate's online resume
      operationId: getResume
      responses:
        '200':
          description: Resume
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/Resume"
        '404':
          "$ref": "#/components/responses/NotFound"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
    put:
      tags:
      - Resume
      summary: Replace the candidate's online resume
      operationId: saveResume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SaveResumeRequest"
      responses:
        '200':
          description: Saved resume
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/Resume"
        '422':
          "$ref": "#/components/responses/ValidationError"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
  "/features/learning":
    get:
      tags:
      - Features
      summary: Get Learning feature availability
      operationId: getLearningFeature
      responses:
        '200':
          description: Learning availability
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/LearningFeature"
      x-status: DRAFT
      x-clients:
      - Candidate
      x-permission: Authenticated Candidate
  "/recruiter/me":
    get:
      tags:
      - Profile
      summary: Get current recruiter
      operationId: getRecruiterMe
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter self
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/RecruiterProfile"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/recruiter/company":
    get:
      tags:
      - Profile
      summary: Get recruiter company
      operationId: getRecruiterCompany
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter company member
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/Company"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
    patch:
      tags:
      - Profile
      summary: Update recruiter company
      operationId: updateRecruiterCompany
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter company admin capability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateCompanyRequest"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/Company"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/recruiter/dashboard":
    get:
      tags:
      - Profile
      summary: Get own-company dashboard
      operationId: getRecruiterDashboard
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter; own-company aggregate
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/RecruiterDashboard"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/recruiter/jobs":
    get:
      tags:
      - Jobs
      summary: List own-company jobs
      operationId: listRecruiterJobs
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter; own company
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          "$ref": "#/components/schemas/JobStatus"
      - name: employmentType
        in: query
        schema:
          "$ref": "#/components/schemas/EmploymentType"
      - name: location
        in: query
        schema:
          type: string
      - name: ownerId
        in: query
        schema:
          type: string
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/PageSize"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/PageResponse"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        "$ref": "#/components/schemas/RecruiterJobSummary"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
    post:
      tags:
      - Jobs
      summary: Create job draft
      operationId: createRecruiterJob
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter; verified own company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateJobRequest"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/RecruiterJobDetail"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/recruiter/jobs/{jobId}":
    get:
      tags:
      - Jobs
      summary: Get own-company job
      operationId: getRecruiterJob
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter; own-company job
      parameters:
      - "$ref": "#/components/parameters/JobId"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/RecruiterJobDetail"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
    patch:
      tags:
      - Jobs
      summary: Update own-company job
      operationId: updateRecruiterJob
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter; own-company job + edit capability
      parameters:
      - "$ref": "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateJobRequest"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/RecruiterJobDetail"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/recruiter/jobs/{jobId}/publish":
    post:
      tags:
      - Jobs
      summary: Publish job
      operationId: publishRecruiterJob
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter; own company; verified company
      parameters:
      - "$ref": "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PublishJobRequest"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/RecruiterJobDetail"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/recruiter/jobs/{jobId}/status":
    post:
      tags:
      - Jobs
      summary: Change job lifecycle status
      operationId: changeRecruiterJobStatus
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter; own-company job
      parameters:
      - "$ref": "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ChangeJobStatusRequest"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/RecruiterJobDetail"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/recruiter/applications":
    get:
      tags:
      - Applications
      summary: List own-company applications
      operationId: listRecruiterApplications
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter; applications to own-company jobs
      parameters:
      - name: status
        in: query
        schema:
          "$ref": "#/components/schemas/ApplicationStatus"
      - name: jobId
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
      - name: ownerId
        in: query
        schema:
          type: string
      - name: minMatchScore
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/PageSize"
      - name: sort
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RecruiterApplicationListResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/recruiter/applications/{applicationId}":
    get:
      tags:
      - Applications
      summary: Get own-company application detail
      operationId: getRecruiterApplication
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter; own-company application
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/RecruiterApplicationDetail"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/recruiter/applications/{applicationId}/transitions":
    post:
      tags:
      - Applications
      summary: Transition application status
      operationId: transitionRecruiterApplication
      x-status: DRAFT
      x-clients:
      - Recruiter
      x-permission: Recruiter; own-company application; cannot set WITHDRAWN
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ApplicationTransitionRequest"
      responses:
        '201':
          description: Transition created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/ApplicationTransitionResult"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/recruiter/applications/{applicationId}/owner":
    put:
      tags:
      - Applications
      summary: Assign application owner
      operationId: assignRecruiterApplicationOwner
      x-status: DRAFT
      x-clients:
