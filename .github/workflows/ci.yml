name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  gitleaks:                     
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2

  backend:                     
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: run maven tests
        working-directory: backend
        run: mvn -B test
      - name: upload backend test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports

  web:                         
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: run web checks
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test -- --reporter=junit --outputFile=junit.xml
          npm run build
      - name: upload web test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-junit-report
          path: web/junit.xml

  android:                     
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - name: build & test android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lint test --no-daemon
      - name: upload android test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/tests/testReleaseUnitTest
            android/app/build/test-results/testReleaseUnitTest/*.xml
            android/app/build/reports/lint-results-*.html

  sca:                      
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - name: generate android dependency lockfile
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew dependencies --write-locks --no-daemon
      - name: scan backend (Maven)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: scan web (npm)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: web
          skip-dirs: node_modules
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          skip-setup-trivy: true
      - name: scan android (Gradle)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: android
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          skip-setup-trivy: true

  docker-build:              
    runs-on: ubuntu-latest
    needs: [ backend, web ]
    steps:
      - uses: actions/checkout@v4
      - name: build backend image
        run: docker build -f infra/docker/Dockerfile.backend -t adproject-backend .
      - name: build web image
        run: docker build -f infra/docker/Dockerfile.web -t adproject-web .