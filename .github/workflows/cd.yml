name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/bianhaifan/ad-backend
  IMAGE_WEB: ghcr.io/bianhaifan/ad-web

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:latest

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: ${{ env.IMAGE_WEB }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    environment: production
    concurrency: deploy-prod
    steps:
      - name: pull & run on target server B
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /opt/adproject/infra/docker
            docker compose --env-file /opt/adproject/infra/docker/.env pull
            docker compose --env-file /opt/adproject/infra/docker/.env up -d --remove-orphans
            docker image prune -f
            sleep 5
            curl -sS -o /dev/null -w "health_probe=%{http_code}\n" http://localhost/api/v1/auth/login || true
