spring:
  datasource:
    url: jdbc:h2:mem:adproject;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

app:
  auth:
    jwt-secret: test-only-secret-at-least-thirty-two-bytes-long
