spring:
  application:
    name: adproject-backend
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  auth:
    access-token-seconds: 7200
    refresh-token-seconds: 2592000
    jwt-secret: ${JWT_SECRET}
  mail:
    smtp-host: ${SMTP_HOST:}
    smtp-port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from-address: ${SMTP_FROM_ADDRESS:}
    start-tls: ${SMTP_STARTTLS:true}
  google-oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
    token-encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY:}
    web-return-uri: ${GOOGLE_OAUTH_WEB_RETURN_URI:}
  recommendation:
    enabled: ${ML_ENABLED:true}
    base-url: ${ML_BASE_URL:http://127.0.0.1:8000}
    internal-token: ${ML_INTERNAL_TOKEN:local-ml-token}
    connect-timeout: ${ML_CONNECT_TIMEOUT:2s}
    read-timeout: ${ML_READ_TIMEOUT:5s}
    max-jobs: ${ML_MAX_JOBS:500}
  agent:
    planner-base-url: ${AGENT_PLANNER_BASE_URL:http://localhost:8090}
    preview-ttl-seconds: ${AGENT_PREVIEW_TTL_SECONDS:900}
    connect-timeout: ${AGENT_PLANNER_CONNECT_TIMEOUT:3s}
    read-timeout: ${AGENT_PLANNER_READ_TIMEOUT:20s}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    connect-timeout: ${DEEPSEEK_CONNECT_TIMEOUT:5s}
    read-timeout: ${DEEPSEEK_READ_TIMEOUT:60s}
